<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A MEDIDA Confecciones. Uniformes escolares, empresariales y de salud hechos a la medida.">
    <meta name="theme-color" content="#1e2a44">
    <title>A MEDIDA Confecciones | Sastrería y Confección</title>
    <!-- Favicon: the gold A on a blue field, per block 04 of the system -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
    <!-- System typefaces: Didone for the brand, sans for service, mono for figures -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Old+Standard+TT:wght@400;700&family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/styles/tokens.css">
    <link rel="stylesheet" href="/src/styles/content.css">
    <script type="module" src="/src/main.js"></script>
</head>
<body>
    <!-- The site is a tape-measure column over the cream floor:
         graduated on both sides and finished with the gold tip -->
    <am-tape>
        <!-- Cover: brand, service and contact on the first screen -->
        <am-segment cover id="home">
            <div class="brand">
                <p class="brand__name">
                    <span class="brand__a">A</span><span class="brand__measure">Medida</span>
                </p>
                <p class="brand__descriptor">Confecciones</p>
            </div>

            <span class="rule" aria-hidden="true"></span>

            <h1 class="tagline">Uniformes escolares, empresariales y de salud</h1>

            <!-- Contact details in Archivo, icons in gold -->
            <nav class="contact" aria-label="Información de contacto">
                <a href="tel:+573000000000" class="contact__item" title="Llamar por teléfono">
                    <svg class="contact__icon" viewBox="0 0 24 24" width="17" height="17" fill="none" aria-hidden="true">
                        <rect x="6" y="2" width="12" height="20" rx="3" stroke="currentColor" stroke-width="2"></rect>
                        <line x1="10" y1="18.5" x2="14" y2="18.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"></line>
                    </svg>
                    <span>300 000 0000</span>
                </a>

                <a href="mailto:contacto@amedidaconfecciones.com" class="contact__item contact__item--email" title="Enviar correo electrónico">
                    <svg class="contact__icon" viewBox="0 0 24 24" width="17" height="17" fill="none" aria-hidden="true">
                        <rect x="2" y="5" width="20" height="14" rx="2" stroke="currentColor" stroke-width="2"></rect>
                        <path d="M3 7 L12 13.5 L21 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
                    </svg>
                    <span>contacto@amedidaconfecciones.com</span>
                </a>
            </nav>

            <p class="hours">Lunes a viernes 8:00 a 17:00 · sábados 8:00 a 12:00</p>

            <!-- Actions: square-cut rectangles with a gold border -->
            <div class="actions">
                <a href="https://wa.me/573000000000" target="_blank" rel="noopener noreferrer" class="button" title="Escribir por WhatsApp">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" aria-hidden="true">
                        <path d="M21 11.5a8.5 8.5 0 0 1-12.6 7.4L3.5 20.5l1.7-4.7A8.5 8.5 0 1 1 21 11.5Z" stroke="var(--tape-accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
                    </svg>
                    <span>WhatsApp</span>
                </a>
                <a href="#quote" class="button">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" aria-hidden="true">
                        <line x1="4" y1="7" x2="20" y2="7" stroke="var(--tape-accent)" stroke-width="2" stroke-linecap="round"></line>
                        <line x1="4" y1="12" x2="16" y2="12" stroke="var(--tape-accent)" stroke-width="2" stroke-linecap="round"></line>
                        <line x1="4" y1="17" x2="12" y2="17" stroke="var(--tape-accent)" stroke-width="2" stroke-linecap="round"></line>
                    </svg>
                    <span>Cotizar</span>
                </a>
            </div>
        </am-segment>

        <!-- Quoter: garments, quantities and details, step by step -->
        <am-segment id="quote">
            <am-quoter></am-quoter>

            <noscript>
                <p class="lead">El cotizador necesita JavaScript. Escríbanos por WhatsApp al 300 000 0000 y armamos el pedido con usted.</p>
            </noscript>
        </am-segment>
    </am-tape>
</body>
</html>
