<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A MEDIDA Confecciones. Uniformes escolares, empresariales y de salud hechos a la medida.">
    <meta name="theme-color" content="#1e2a44">
    <title>A MEDIDA Confecciones | Sastrería y Confección</title>
    <!-- Favicon: la A en oro sobre campo azul, según el bloque 04 del sistema -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
    <!-- Tipografías del sistema: didona para la marca, sans para servicio, mono para cifras -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Old+Standard+TT:wght@400;700&family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/estilos/tokens.css">
    <link rel="stylesheet" href="/src/estilos/contenido.css">
    <script type="module" src="/src/main.js"></script>
</head>
<body>
    <!-- La página es un tramo de cinta métrica en vertical: entra cortada a
         escuadra por arriba, se gradúa en los dos costados y termina en la
         punta de oro con remache al final del scroll -->
    <am-cinta>
        <!-- Portada: marca, servicio y contacto en la primera pantalla -->
        <am-tramo portada id="inicio">
            <div class="marca">
                <h1 class="marca__nombre">
                    <span class="marca__a">A</span><span class="marca__medida">Medida</span>
                </h1>
                <p class="marca__descriptor">Confecciones</p>
            </div>

            <span class="filete" aria-hidden="true"></span>

            <h2 class="titulo">Uniformes escolares, empresariales y de salud</h2>

            <!-- Datos de contacto en Archivo, iconos en oro -->
            <nav class="contacto" aria-label="Información de contacto">
                <a href="tel:3000000000" class="contacto__item" title="Llamar por teléfono">
                    <svg class="contacto__icono" viewBox="0 0 24 24" width="19" height="19" fill="none" aria-hidden="true">
                        <rect x="6" y="2" width="12" height="20" rx="3" stroke="currentColor" stroke-width="2"></rect>
                        <line x1="10" y1="18.5" x2="14" y2="18.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"></line>
                    </svg>
                    <span>300 000 0000</span>
                </a>

                <a href="mailto:contacto@amedidaconfecciones.com" class="contacto__item" title="Enviar correo electrónico">
                    <svg class="contacto__icono" viewBox="0 0 24 24" width="19" height="19" fill="none" aria-hidden="true">
                        <rect x="2" y="5" width="20" height="14" rx="2" stroke="currentColor" stroke-width="2"></rect>
                        <path d="M3 7 L12 13.5 L21 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
                    </svg>
                    <span>contacto@amedidaconfecciones.com</span>
                </a>

                <!-- Acciones: rectángulos cortados a escuadra, borde en oro -->
                <div class="acciones">
                    <a href="https://wa.me/573000000000" target="_blank" rel="noopener noreferrer" class="accion" title="Escribir por WhatsApp">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
                        </svg>
                        <span>WhatsApp</span>
                    </a>
                    <a href="#cotizador" class="accion">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M4 7h16M4 12h16M4 17h9"></path>
                        </svg>
                        <span>Cotizar</span>
                    </a>
                </div>
            </nav>
        </am-tramo>

        <!-- Cotizador: arma el pedido y lo entrega por WhatsApp o correo -->
        <am-tramo ultimo id="cotizador">
            <span class="filete" aria-hidden="true"></span>

            <h2 class="titulo">Arme su cotización</h2>
            <p class="entrada">Complete la dotación que necesita. Los datos se arman en un solo mensaje y salen por WhatsApp o por correo, sin registro.</p>

            <am-cotizador></am-cotizador>

            <noscript>
                <p class="entrada">El cotizador necesita JavaScript. Escríbanos por WhatsApp al 300 813 6853 y armamos el pedido con usted.</p>
            </noscript>
        </am-tramo>
    </am-cinta>
</body>
</html>
