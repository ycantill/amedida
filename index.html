<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A MEDIDA Confecciones | Sastrería y Confección</title>
    <!-- Tipografías Grotescas desde Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Host+Grotesk:wght@400;500;600;700;800&family=Hanken+Grotesk:wght@400;500;600;700;800;900&family=Schibsted+Grotesk:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Marco perimetral con costura de pespunte que emula la tarjeta bordada -->
    <div class="marco-costura" aria-hidden="true">
        <div class="linea-pespunte"></div>
    </div>

    <!-- Contenedor principal centrado -->
    <main class="page-container">
        <!-- Primera sección: Nombre de Marca A MEDIDA -->
        <section class="hero-brand" id="inicio">
            <div class="brand-text-block">
                <h1 class="brand-name">
                    <span class="letra-a">A</span><span class="letra-medida">MEDIDA</span>
                </h1>
                <p class="brand-subtitle">C O N F E C C I O N E S</p>
            </div>

            <!-- Datos de contacto estilo tarjeta de atelier -->
            <nav class="tarjeta-contacto" aria-label="Información de contacto">
                <div class="contacto-bloque-directo">
                    <a href="tel:3008136853" class="contacto-item" title="Llamar por teléfono">
                        <svg class="icono-contacto" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
                        </svg>
                        <span>3008136853</span>
                    </a>
                    <span class="separador-contacto" aria-hidden="true">·</span>
                    <a href="mailto:contacto@amedidaconfecciones.com" class="contacto-item" title="Enviar correo electrónico">
                        <svg class="icono-contacto" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                            <polyline points="22,6 12,13 2,6"></polyline>
                        </svg>
                        <span>contacto@amedidaconfecciones.com</span>
                    </a>
                </div>
                <div class="contacto-bloque-whatsapp">
                    <a href="https://wa.me/573008136853" target="_blank" rel="noopener noreferrer" class="contacto-item" title="Escribir por WhatsApp">
                        <svg class="icono-contacto" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
                        </svg>
                        <span>WhatsApp</span>
                    </a>
                </div>
            </nav>
        </section>
    </main>
</body>
</html>
